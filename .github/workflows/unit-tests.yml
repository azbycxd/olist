name: Offline unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLIST_LOAD_DOTENV: '0'
      CI_OFFLINE: '1'
      RUN_DB_TESTS: '0'
      RUN_MCP_TESTS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not integration' --strict-markers -q --junitxml=unit-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-tests
          path: unit-tests.xml
          if-no-files-found: error
