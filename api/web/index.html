<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olist · 有据可查</title>
<style>
:root{color-scheme:light;font:15px/1.6 system-ui,sans-serif;color:#20362f;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;background:#173e35;color:#fff;display:flex;align-items:center;justify-content:space-between}header p{margin:0;color:#bdd6c9}h1{margin:0;font-size:27px;letter-spacing:.08em}main{max-width:1440px;margin:30px auto;padding:0 28px;display:grid;grid-template-columns:310px 1fr;gap:22px}section,aside{background:#fff;border:1px solid #dce3dc;border-radius:12px;padding:24px;margin-bottom:20px}h2{font-size:18px;margin:0 0 16px}textarea,input,select{width:100%;padding:12px;border:1px solid #b7c6be;border-radius:7px;font:inherit;margin-bottom:10px}textarea{min-height:120px}button{border:0;border-radius:6px;background:#25654f;color:white;padding:10px 15px;cursor:pointer;font:inherit;margin:3px 7px 3px 0}button.secondary{background:#e6eee9;color:#244f40}button:disabled{opacity:.5;cursor:wait}.muted{color:#65786d;font-size:13px}.hidden{display:none!important}#timeline{max-height:330px;overflow:auto;font-size:13px;padding-left:18px}#timeline li{padding:4px 0;border-bottom:1px solid #edf0eb}.status{flex-shrink:0;white-space:nowrap;padding:5px 12px;border-radius:20px;background:#e5eee4;font-size:13px;color:#315a45}#report{white-space:pre-wrap;line-height:1.9}#tasks button{display:block;width:100%;text-align:left;background:#f0f4ef;color:#254d3b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stats{display:flex;flex-wrap:wrap;gap:16px;padding:12px 0;color:#42604e}details{border-top:1px solid #dde7df;padding:12px 0}summary{cursor:pointer;color:#166348}pre{white-space:pre-wrap;background:#f1f4ef;padding:15px;border-radius:6px;overflow:auto}table{border-collapse:collapse;font-size:13px;width:100%;display:block;overflow:auto}th,td{text-align:left;border:1px solid #d8e1d9;padding:7px 12px}#error{color:#a33426;white-space:pre-wrap}.planpart{border-left:3px solid #abc6b3;padding-left:15px;margin-bottom:20px}.planpart textarea{min-height:80px}#login{max-width:550px;margin:45px auto}#login button{min-width:120px}a{color:#166348}.number{color:#126e4d;text-decoration:underline dotted;cursor:pointer;background:transparent;padding:0;margin:0;border-radius:0;font:inherit}dialog{width:min(1000px,92vw);max-height:85vh;border:1px solid #bdcec3;border-radius:12px;padding:25px}#evidenceDetail{overflow:auto}.taskTitle{display:flex;justify-content:space-between;gap:15px;align-items:center}@media(max-width:800px){main{display:block;padding:0 12px}header{padding:20px}aside{padding:18px}}
</style>
<header><div><h1>OLIST / 有据可查</h1><p>让业务问题回到数据证据。点击报告中的数字查看查询。</p></div><button id="logout" class="secondary hidden">退出</button></header>
<div id="login"><section><h2>登录工作台</h2><label>用户名<input id="username" autocomplete="username" placeholder="字母、数字、下划线"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少十个字符"></label><button id="loginBtn">登录</button><button id="registerBtn" class="secondary">注册</button><p class="muted">任务和记忆仅对当前账户可见。</p></section></div>
<p id="error" role="alert" style="max-width:1200px;margin:15px auto"></p>
<main id="workspace" class="hidden"><div><aside><h2>提出问题</h2><textarea id="question" placeholder="例如：分析某个季度的销售表现，并说明数据能支持哪些结论。"></textarea><label>分析方式<select id="agentMode"><option value="single">单 Agent（默认）</option><option value="multi">多智能体（先确认计划）</option></select></label><label>长任务上下文<select id="contextStrategy"><option value="none">默认</option><option value="mask">压缩旧查询结果</option></select></label><button id="ask">开始分析</button></aside><aside><h2>我的任务</h2><div id="tasks"></div><button id="refresh" class="secondary">刷新列表</button></aside><aside><h2>长期记忆</h2><div id="memories"></div><button id="loadMemory" class="secondary">查看记忆</button></aside></div>
<div><section><div class="taskTitle"><h2 id="title">选择任务或提出新问题</h2><span id="status" class="status">准备就绪</span></div><div id="stats" class="stats"></div><div id="plan" class="hidden"><p class="muted">可修改子问题；确认后开始查询。依赖项填写其他子问题的 ID，用逗号分隔。</p><div id="parts"></div><button id="confirm">确认计划并执行</button></div><div id="report"></div><div id="claims"></div></section><section><h2>执行时间线</h2><ol id="timeline"></ol><p id="connection" class="muted">事件会保留，刷新页面或重连后继续读取。</p></section></div></main>
<dialog id="evidenceDialog"><button id="closeEvidence" class="secondary">关闭</button><div id="evidenceDetail"></div></dialog>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('olist-token')||'',current=null,streamController=null,seq=0,planData=null;
const statuses={pending:'排队中',planning:'生成计划',awaiting_confirmation:'等待确认',running:'分析进行中',completed:'已完成',failed:'执行失败',canceled:'已取消'};
function error(e){$('error').textContent=e.message||String(e)}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let v=await r.json().catch(()=>({detail:r.statusText}));throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail))}return r.status===204?null:r.json()}
async function auth(path){try{let v=await api(path,'POST',{username:$('username').value,password:$('password').value});token=v.access_token;sessionStorage.setItem('olist-token',token);$('password').value='';await init()}catch(e){error(e)}}
async function init(){$('login').classList.toggle('hidden',!!token);$('workspace').classList.toggle('hidden',!token);$('logout').classList.toggle('hidden',!token);if(token)await listTasks()}
async function listTasks(){let v=await api('/tasks');$('tasks').replaceChildren();for(let t of v.tasks){let b=document.createElement('button');b.textContent=(statuses[t.status]||t.status)+' · '+t.question;b.onclick=()=>selectTask(t.task_id);$('tasks').append(b)}}
function plain(parent,tag,text){let el=document.createElement(tag);el.textContent=text;parent.append(el);return el}
async function selectTask(id){if(streamController)streamController.abort();current=id;seq=0;$('timeline').replaceChildren();await refreshTask();watch(id)}
async function refreshTask(){if(!current)return;const id=current,t=await api('/tasks/'+id);if(id!==current)return;$('title').textContent=t.question;$('status').textContent=statuses[t.status]||t.status;$('status').dataset.state=t.status;
const u=t.usage;$('stats').textContent='Token '+(u.total_tokens===null?'完整用量未知（已记录 '+u.known_tokens+'）':u.total_tokens)+' · 模型耗时 '+(u.model_latency_ms/1000).toFixed(1)+' 秒 · 任务已历时 '+(u.elapsed_ms/1000).toFixed(1)+' 秒';
$('plan').classList.toggle('hidden',t.status!=='awaiting_confirmation');if(t.status==='awaiting_confirmation'){planData=t.plan;$('parts').replaceChildren();for(let p of planData.subtasks){let box=plain($('parts'),'div','');box.className='planpart';plain(box,'strong',p.id);let q=plain(box,'textarea',p.question);q.value=p.question;q.dataset.part=p.id;let d=plain(box,'input','');d.value=p.depends_on.join(',');d.placeholder='依赖项 ID（可空）';d.dataset.dep=p.id;}}
$('report').replaceChildren();$('claims').replaceChildren();if(t.result){renderReport(t.result);for(let c of t.result.claims){let detail=plain($('claims'),'details','');plain(detail,'summary',c.text);plain(detail,'pre',JSON.stringify(c.value,null,2));for(let ref of c.evidence){let b=plain(detail,'button','查看 SQL 与结果');b.onclick=()=>showEvidence(ref)}}}if(t.error)plain($('report'),'p','未完成原因：'+t.error)}
function renderReport(result){const text=typeof result.answer==='string'?result.answer:JSON.stringify(result.answer,null,2);const rx=/\[证据\]\(#result-([0-9a-f-]{36})\)|[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:[eE][+-]?\d+)?(?:\s*(万|亿|千))?/g;let pos=0;for(let m of text.matchAll(rx)){$('report').append(document.createTextNode(text.slice(pos,m.index)));if(m[1]){let b=plain($('report'),'button','[证据]');b.className='number';b.onclick=()=>showEvidence(m[1])}else{const n=Math.abs(Number(m[0].replace(/,/g,'').replace(/[万亿千]/g,'').trim()))*({万:10000,亿:100000000,千:1000}[m[2]]||1);let matches=result.claims.filter(c=>numbers(c.value).some(v=>Math.abs(v-n)<=Math.max(v*.01,1e-8)));if(matches.length){let b=plain($('report'),'button',m[0]);b.className='number';b.onclick=()=>showEvidenceChoices(matches)}else $('report').append(document.createTextNode(m[0]));}pos=m.index+m[0].length}$('report').append(document.createTextNode(text.slice(pos)))}
function numbers(v){if(v===null||typeof v==='boolean')return [];if(typeof v==='object')return Object.values(v).flatMap(numbers);const n=Number(v);return String(v).trim()!==''&&Number.isFinite(n)?[Math.abs(n)]:[]}
function showEvidenceChoices(claims){const refs=[...new Set(claims.flatMap(c=>c.evidence))];if(refs.length===1)return showEvidence(refs[0]);$('evidenceDetail').replaceChildren();plain($('evidenceDetail'),'h2','包含该数值的已批准结论');for(let c of claims){plain($('evidenceDetail'),'p',c.text);for(let ref of c.evidence){let b=plain($('evidenceDetail'),'button','展开 SQL 与结果');b.onclick=()=>showEvidence(ref)}}$('evidenceDialog').showModal()}
async function showEvidence(ref){try{let r=await api('/tasks/'+current+'/results/'+ref);$('evidenceDetail').replaceChildren();plain($('evidenceDetail'),'h2','查询证据');plain($('evidenceDetail'),'p',r.truncated===true?'结果已截断：仅保存前1000行，完整汇总请在SQL中完成。':r.truncated===false?'结果未截断。':'历史结果未记录截断状态。');plain($('evidenceDetail'),'pre',r.sql);plain($('evidenceDetail'),'p','数据版本：'+r.data_version+(r.source_result_id?' · 来自历史分析，原始证据 '+r.source_result_id:''));let table=plain($('evidenceDetail'),'table',''),head=plain(table,'tr','');for(let k of r.columns)plain(head,'th',k);for(let row of r.rows){let tr=plain(table,'tr','');for(let k of r.columns)plain(tr,'td',row[k]===null?'NULL':String(row[k]))}if(!$('evidenceDialog').open)$('evidenceDialog').showModal()}catch(e){error(e)}}
async function watch(id){streamController=new AbortController();const signal=streamController.signal;while(!signal.aborted&&current===id){try{const r=await fetch('/tasks/'+id+'/events',{headers:{Authorization:'Bearer '+token,'Last-Event-ID':String(seq)},signal});if(!r.ok)throw Error('进度连接失败：'+r.status);$('connection').textContent='实时连接 · 已接收事件 '+seq;const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){let {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){let frame=buffer.slice(0,end);buffer=buffer.slice(end+2);let data=frame.split('\n').find(l=>l.startsWith('data: '));if(!data)continue;let eventId=frame.match(/^id: (\d+)/m);if(eventId){let next=Number(eventId[1]);if(next<=seq)continue;seq=next;let event=JSON.parse(data.slice(6));if(event.type==='worker_claimed'){let state=event.payload.phase==='plan'?'planning':'running';$('status').dataset.state=state;$('status').textContent=event.payload.recovered?'已接管，继续分析':statuses[state]}const label=labels[event.type];if(label){plain($('timeline'),'li',label+' · '+describe(event));$('timeline').scrollTop=$('timeline').scrollHeight;}$('connection').textContent='实时连接 · 已接收事件 '+seq}else if(frame.includes('event: state')){await refreshTask();await listTasks();return}}}await refreshTask();}catch(e){if(signal.aborted)return;$('connection').textContent='连接中断，正在从事件 '+seq+' 续接…';}await new Promise(r=>setTimeout(r,1000));}}
const labels={worker_claimed:'任务领取',plan:'计划已生成',plan_confirmed:'计划已确认',subtask_started:'开始分析',tool_call:'查证',tool_result:'查证结果',review:'审核',subtask_retry:'重新查证',subtask_checkpoint:'分析项已保存',subtasks_reused:'从检查点恢复',subtask_review_resumed:'继续审核',finding_reused:'复用历史分析',number_gate:'检查报告数字',report:'报告已生成',task_status:'任务状态'};
function describe(e){const p=e.payload;return p.subtask_id||p.name||p.status||p.reason||p.role||(e.type==='subtasks_reused'?'复用完成项 '+p.subtask_ids.join(', '):e.type==='worker_claimed'?(p.recovered?'租约接管，继续执行':'任务已领取'):'已记录')}
$('loginBtn').onclick=()=>auth('/login');$('registerBtn').onclick=()=>auth('/register');$('logout').onclick=()=>{sessionStorage.removeItem('olist-token');location.reload()};$('refresh').onclick=()=>listTasks().catch(error);$('ask').onclick=async()=>{try{let t=await api('/tasks','POST',{question:$('question').value,agent_mode:$('agentMode').value,context_strategy:$('contextStrategy').value});await listTasks();await selectTask(t.task_id)}catch(e){error(e)}};
$('confirm').onclick=async()=>{try{let p={subtasks:planData.subtasks.map(part=>({id:part.id,question:document.querySelector('[data-part="'+part.id+'"]').value,memory_ids:document.querySelector('[data-part="'+part.id+'"]').value===part.question?(part.memory_ids||[]):[],depends_on:document.querySelector('[data-dep="'+part.id+'"]').value.split(',').map(v=>v.trim()).filter(Boolean)}))};await api('/tasks/'+current+'/confirm','POST',p);await refreshTask();watch(current)}catch(e){error(e)}};
$('loadMemory').onclick=async()=>{try{let v=await api('/memories');$('memories').replaceChildren();for(let m of v.memories){let d=plain($('memories'),'div','');plain(d,'p',(m.type==='finding'?'已审核结论：':'偏好：')+m.source_quote);let b=plain(d,'button','删除');b.className='secondary';b.onclick=async()=>{await api('/memories/'+m.memory_id,'DELETE');d.remove()}}if(!v.memories.length)plain($('memories'),'p','暂无长期记忆')}catch(e){error(e)}};
$('closeEvidence').onclick=()=>$('evidenceDialog').close();init().catch(error);
</script></html>
