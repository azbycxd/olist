services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: olist_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_admin_change_me}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-local_reader_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U olist_admin -d agent"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  init-data:
    build: .
    image: olist-agent:local
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TOKEN_PRICE_INPUT: ${TOKEN_PRICE_INPUT:-}
      TOKEN_PRICE_CACHED_INPUT: ${TOKEN_PRICE_CACHED_INPUT:-}
      TOKEN_PRICE_OUTPUT: ${TOKEN_PRICE_OUTPUT:-}
      METRIC_DURATION_BUCKETS: ${METRIC_DURATION_BUCKETS:-.005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,120,300}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: olist_admin
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${DEEPSEEK_BASE_URL:-${OPENAI_BASE_URL:-}}
      OPENAI_MODEL: ${DEEPSEEK_MODEL:-${OPENAI_MODEL:-}}
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-}
      EVAL_ADAPTER: ${EVAL_ADAPTER:-zero}
      EVAL_JUDGE: ${EVAL_JUDGE:-off}
      EVAL_INPUT_PRICE_PER_MILLION: ${EVAL_INPUT_PRICE_PER_MILLION:-}
      EVAL_OUTPUT_PRICE_PER_MILLION: ${EVAL_OUTPUT_PRICE_PER_MILLION:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings:8002/v1}
      RETRIEVAL_METHOD: ${RETRIEVAL_METHOD:-vector}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      NUMBER_GATE: ${NUMBER_GATE:-true}
      BOUNDARY_GUARDS: ${BOUNDARY_GUARDS:-false}
      AGENT_MODE: ${AGENT_MODE:-single}
      RAG_MODE: ${RAG_MODE:-inject}
      USE_MEMORY: ${USE_MEMORY:-true}
      SMALL_MODEL: ${SMALL_MODEL:-}
      MCP_URL: http://mcp-olist:8001/mcp
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}
      MCP_TOKEN_CLOCK_SKEW_SECONDS: ${MCP_TOKEN_CLOCK_SKEW_SECONDS:-30}
      SCHEMA_MODE: ${SCHEMA_MODE:-on_demand}
      CONTEXT_STRATEGY: ${CONTEXT_STRATEGY:-none}
      CONTEXT_LIMIT: ${CONTEXT_LIMIT:-16000}
      CONTEXT_KEEP_TURNS: ${CONTEXT_KEEP_TURNS:-2}
      CONTEXT_SUMMARY_THRESHOLD: ${CONTEXT_SUMMARY_THRESHOLD:-6000}
      MAX_STEPS: ${MAX_STEPS:-20}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-100000}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-60}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-4096}
      MODEL_RETRY_ATTEMPTS: ${MODEL_RETRY_ATTEMPTS:-4}
      MODEL_RETRY_BASE_SECONDS: ${MODEL_RETRY_BASE_SECONDS:-1}
      MODEL_RETRY_CAP_SECONDS: ${MODEL_RETRY_CAP_SECONDS:-8}
      PROVIDER_FAILURE_THRESHOLD: ${PROVIDER_FAILURE_THRESHOLD:-5}
      PROVIDER_COOLDOWN_SECONDS: ${PROVIDER_COOLDOWN_SECONDS:-30}
      REPEATED_CALL_LIMIT: ${REPEATED_CALL_LIMIT:-3}
      NO_PROGRESS_WINDOW: ${NO_PROGRESS_WINDOW:-6}
      NO_PROGRESS_EMPTY_TURNS: ${NO_PROGRESS_EMPTY_TURNS:-4}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-10}
      MCP_RETRY_ATTEMPTS: ${MCP_RETRY_ATTEMPTS:-1}
      API_POOL_MAX: ${API_POOL_MAX:-8}
      MCP_AGENT_POOL_MAX: ${MCP_AGENT_POOL_MAX:-8}
      MCP_OLIST_POOL_MAX: ${MCP_OLIST_POOL_MAX:-8}
      WORKER_AGENT_POOL_MAX: ${WORKER_AGENT_POOL_MAX:-2}
      WORKER_OLIST_POOL_MAX: ${WORKER_OLIST_POOL_MAX:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      READY_CONNECTION_TIMEOUT_SECONDS: ${READY_CONNECTION_TIMEOUT_SECONDS:-1}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      WORKER_GRACE_SECONDS: ${WORKER_GRACE_SECONDS:-20}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      MAX_SLEEP: ${MAX_SLEEP:-5}
      PROVIDER_REQUEUE_MAX: ${PROVIDER_REQUEUE_MAX:-3}
      PROVIDER_RPM: ${PROVIDER_RPM:-}
      PROVIDER_TPM: ${PROVIDER_TPM:-}
      PROVIDER_MAX_INFLIGHT: ${PROVIDER_MAX_INFLIGHT:-0}
      RATE_WAIT_MAX_SECONDS: ${RATE_WAIT_MAX_SECONDS:-30}
      RATE_POLL_SECONDS: ${RATE_POLL_SECONDS:-0.1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_admin_change_me}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-local_reader_change_me}
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./docs:/app/docs
      - ./logs:/app/logs
      - ./evidence:/app/evidence
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: "no"

  mcp-olist:
    image: olist-agent:local
    entrypoint: ["python", "-m", "mcp_olist.server"]
    environment:
      DIMENSION_PRECHECK: ${DIMENSION_PRECHECK:-true}
      MCP_AGENT_POOL_MAX: ${MCP_AGENT_POOL_MAX:-8}
      MCP_OLIST_POOL_MAX: ${MCP_OLIST_POOL_MAX:-8}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      READY_CONNECTION_TIMEOUT_SECONDS: ${READY_CONNECTION_TIMEOUT_SECONDS:-1}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TOKEN_PRICE_INPUT: ${TOKEN_PRICE_INPUT:-}
      TOKEN_PRICE_CACHED_INPUT: ${TOKEN_PRICE_CACHED_INPUT:-}
      TOKEN_PRICE_OUTPUT: ${TOKEN_PRICE_OUTPUT:-}
      METRIC_DURATION_BUCKETS: ${METRIC_DURATION_BUCKETS:-.005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,120,300}
      PGHOST: db
      PGPORT: "5432"
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings:8002/v1}
      RETRIEVAL_METHOD: ${RETRIEVAL_METHOD:-vector}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-local_reader_change_me}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}
      MCP_TOKEN_CLOCK_SKEW_SECONDS: ${MCP_TOKEN_CLOCK_SKEW_SECONDS:-30}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz',timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  embeddings:
    build:
      context: .
      dockerfile: embeddings/Dockerfile
    image: olist-embeddings:local
    environment:
      RETRIEVAL_METHOD: ${RETRIEVAL_METHOD:-vector}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - embedding_models:/models
    healthcheck:
      start_period: 900s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  memory-api:
    image: olist-agent:local
    profiles: ["memory"]
    entrypoint: ["uvicorn", "api.memories:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TOKEN_PRICE_INPUT: ${TOKEN_PRICE_INPUT:-}
      TOKEN_PRICE_CACHED_INPUT: ${TOKEN_PRICE_CACHED_INPUT:-}
      TOKEN_PRICE_OUTPUT: ${TOKEN_PRICE_OUTPUT:-}
      METRIC_DURATION_BUCKETS: ${METRIC_DURATION_BUCKETS:-.005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,120,300}
      PGHOST: db
      PGPORT: "5432"
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      MEMORY_API_SECRET: ${MEMORY_API_SECRET:-}
      API_POOL_MAX: ${API_POOL_MAX:-8}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      READY_CONNECTION_TIMEOUT_SECONDS: ${READY_CONNECTION_TIMEOUT_SECONDS:-1}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      init-data:
        condition: service_completed_successfully

  agent:
    image: olist-agent:local
    profiles: ["cli"]
    entrypoint: ["python", "-m", "scripts.ask"]
    command: ["--help"]
    environment: &runtime-environment
      BOUNDARY_GUARDS: ${BOUNDARY_GUARDS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TOKEN_PRICE_INPUT: ${TOKEN_PRICE_INPUT:-}
      TOKEN_PRICE_CACHED_INPUT: ${TOKEN_PRICE_CACHED_INPUT:-}
      TOKEN_PRICE_OUTPUT: ${TOKEN_PRICE_OUTPUT:-}
      METRIC_DURATION_BUCKETS: ${METRIC_DURATION_BUCKETS:-.005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,120,300}
      PGHOST: db
      PGPORT: "5432"
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-local_reader_change_me}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings:8002/v1}
      RETRIEVAL_METHOD: ${RETRIEVAL_METHOD:-vector}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      NUMBER_GATE: ${NUMBER_GATE:-true}
      AGENT_MODE: ${AGENT_MODE:-single}
      RAG_MODE: ${RAG_MODE:-inject}
      USE_MEMORY: ${USE_MEMORY:-true}
      SMALL_MODEL: ${SMALL_MODEL:-}
      MCP_URL: http://mcp-olist:8001/mcp
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}
      MCP_TOKEN_CLOCK_SKEW_SECONDS: ${MCP_TOKEN_CLOCK_SKEW_SECONDS:-30}
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${DEEPSEEK_BASE_URL:-${OPENAI_BASE_URL:-}}
      OPENAI_MODEL: ${DEEPSEEK_MODEL:-${OPENAI_MODEL:-}}
      SCHEMA_MODE: ${SCHEMA_MODE:-on_demand}
      CONTEXT_STRATEGY: ${CONTEXT_STRATEGY:-none}
      CONTEXT_LIMIT: ${CONTEXT_LIMIT:-16000}
      CONTEXT_KEEP_TURNS: ${CONTEXT_KEEP_TURNS:-2}
      CONTEXT_SUMMARY_THRESHOLD: ${CONTEXT_SUMMARY_THRESHOLD:-6000}
      MAX_STEPS: ${MAX_STEPS:-20}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-100000}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-60}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-4096}
      MODEL_RETRY_ATTEMPTS: ${MODEL_RETRY_ATTEMPTS:-4}
      MODEL_RETRY_BASE_SECONDS: ${MODEL_RETRY_BASE_SECONDS:-1}
      MODEL_RETRY_CAP_SECONDS: ${MODEL_RETRY_CAP_SECONDS:-8}
      PROVIDER_FAILURE_THRESHOLD: ${PROVIDER_FAILURE_THRESHOLD:-5}
      PROVIDER_COOLDOWN_SECONDS: ${PROVIDER_COOLDOWN_SECONDS:-30}
      REPEATED_CALL_LIMIT: ${REPEATED_CALL_LIMIT:-3}
      NO_PROGRESS_WINDOW: ${NO_PROGRESS_WINDOW:-6}
      NO_PROGRESS_EMPTY_TURNS: ${NO_PROGRESS_EMPTY_TURNS:-4}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-10}
      MCP_RETRY_ATTEMPTS: ${MCP_RETRY_ATTEMPTS:-1}
      API_POOL_MAX: ${API_POOL_MAX:-8}
      MCP_AGENT_POOL_MAX: ${MCP_AGENT_POOL_MAX:-8}
      MCP_OLIST_POOL_MAX: ${MCP_OLIST_POOL_MAX:-8}
      WORKER_AGENT_POOL_MAX: ${WORKER_AGENT_POOL_MAX:-2}
      WORKER_OLIST_POOL_MAX: ${WORKER_OLIST_POOL_MAX:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      READY_CONNECTION_TIMEOUT_SECONDS: ${READY_CONNECTION_TIMEOUT_SECONDS:-1}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      WORKER_GRACE_SECONDS: ${WORKER_GRACE_SECONDS:-20}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      MAX_SLEEP: ${MAX_SLEEP:-5}
      PROVIDER_REQUEUE_MAX: ${PROVIDER_REQUEUE_MAX:-3}
      PROVIDER_RPM: ${PROVIDER_RPM:-}
      PROVIDER_TPM: ${PROVIDER_TPM:-}
      PROVIDER_MAX_INFLIGHT: ${PROVIDER_MAX_INFLIGHT:-0}
      RATE_WAIT_MAX_SECONDS: ${RATE_WAIT_MAX_SECONDS:-30}
      RATE_POLL_SECONDS: ${RATE_POLL_SECONDS:-0.1}
    volumes:
      - ./logs:/app/logs
      - ./evidence:/app/evidence
    depends_on:
      mcp-olist:
        condition: service_healthy

  api:
    image: olist-agent:local
    entrypoint: ["uvicorn", "api.tasks:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BOUNDARY_GUARDS: ${BOUNDARY_GUARDS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TOKEN_PRICE_INPUT: ${TOKEN_PRICE_INPUT:-}
      TOKEN_PRICE_CACHED_INPUT: ${TOKEN_PRICE_CACHED_INPUT:-}
      TOKEN_PRICE_OUTPUT: ${TOKEN_PRICE_OUTPUT:-}
      METRIC_DURATION_BUCKETS: ${METRIC_DURATION_BUCKETS:-.005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,120,300}
      PGHOST: db
      PGPORT: "5432"
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_change_me}
      MEMORY_API_SECRET: ${MEMORY_API_SECRET:-}
      API_POOL_MAX: ${API_POOL_MAX:-8}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      READY_CONNECTION_TIMEOUT_SECONDS: ${READY_CONNECTION_TIMEOUT_SECONDS:-1}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      TOKEN_BUDGET: ${PRODUCT_TOKEN_BUDGET:-100000}
      TASK_MAX_SECONDS: ${TASK_MAX_SECONDS:-300}
      USER_MAX_RUNNING_TASKS: ${USER_MAX_RUNNING_TASKS:-2}
      USER_DAILY_TOKEN_QUOTA: ${USER_DAILY_TOKEN_QUOTA:-1000000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    image: olist-agent:local
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_health"]
      interval: 5s
      timeout: 7s
      retries: 3
    entrypoint: ["python", "-m", "scripts.task_worker"]
    environment:
      <<: *runtime-environment
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-local_reader_change_me}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      FINDING_MIN_SIMILARITY: ${FINDING_MIN_SIMILARITY:-0.78}
      TOKEN_BUDGET: ${PRODUCT_TOKEN_BUDGET:-100000}
      TASK_MAX_SECONDS: ${TASK_MAX_SECONDS:-300}
      USER_MAX_RUNNING_TASKS: ${USER_MAX_RUNNING_TASKS:-2}
      USER_DAILY_TOKEN_QUOTA: ${USER_DAILY_TOKEN_QUOTA:-1000000}
    depends_on:
      api:
        condition: service_healthy
      mcp-olist:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    profiles: [chaos]
    ports:
      - "127.0.0.1:8474:8474"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  postgres_data:
  embedding_models:
